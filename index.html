<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Send My Report Card</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <style>
    :root {
      --bg: #f6f1ea;
      --bg-glow: #efe3d2;
      --card: #ffffff;
      --ink: #1f1b16;
      --muted: #6f665c;
      --line: #e6ddd1;
      --accent: #7a2e3a;
      --accent-ink: #ffffff;
      --accent-soft: #f5e9eb;
      --ok: #1f7a4d;
      --ok-soft: #e8f5ee;
      --err: #b42318;
      --err-soft: #fdecea;
      --shadow: 0 1px 2px rgba(31,27,22,.04), 0 12px 40px -12px rgba(31,27,22,.18);
    }
    /* Dark: follow the device unless the visitor picked light; or when they picked dark. */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #16130f;
        --bg-glow: #2a201a;
        --card: #1f1b17;
        --ink: #f3ede6;
        --muted: #a79d91;
        --line: #362f28;
        --accent: #d98b98;
        --accent-ink: #1a0f11;
        --accent-soft: #3a2328;
        --ok: #6fcf97;
        --ok-soft: #1a2e23;
        --err: #f28b82;
        --err-soft: #3a1d1b;
        --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 40px -12px rgba(0,0,0,.6);
      }
    }
    :root[data-theme="dark"] {
      --bg: #16130f;
      --bg-glow: #2a201a;
      --card: #1f1b17;
      --ink: #f3ede6;
      --muted: #a79d91;
      --line: #362f28;
      --accent: #d98b98;
      --accent-ink: #1a0f11;
      --accent-soft: #3a2328;
      --ok: #6fcf97;
      --ok-soft: #1a2e23;
      --err: #f28b82;
      --err-soft: #3a1d1b;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 40px -12px rgba(0,0,0,.6);
    }
    :root { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; } }
    .theme-toggle {
      position: fixed; top: 16px; right: 16px; z-index: 10;
      width: 42px; height: 42px; padding: 0; border-radius: 50%;
      display: grid; place-items: center;
      background: var(--card); color: var(--ink);
      border: 1px solid var(--line); box-shadow: var(--shadow);
      cursor: pointer; transition: transform .15s, border-color .15s;
    }
    .theme-toggle:hover { border-color: var(--muted); filter: none; }
    .theme-toggle:active { transform: scale(.94); }
    .theme-toggle .moon { display: none; }
    .dark-active .theme-toggle .sun { display: none; }
    .dark-active .theme-toggle .moon { display: block; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: radial-gradient(ellipse 80% 50% at 50% 0%, var(--bg-glow), transparent 70%), var(--bg);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 32px 16px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%; max-width: 440px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .banner {
      padding: 32px 32px 0;
      display: flex; flex-direction: column; align-items: flex-start; gap: 16px;
    }
    .emblem {
      width: 52px; height: 52px; border-radius: 14px;
      display: grid; place-items: center;
      background: var(--accent-soft); color: var(--accent);
    }
    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600; font-size: 28px; line-height: 1.15;
      letter-spacing: -0.01em; margin: 0;
    }
    .sub { margin: 8px 0 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
    .body { padding: 28px 32px 32px; }
    label { display: block; font-size: 13px; font-weight: 600; color: var(--muted);
            text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
    .select-wrap { position: relative; margin-bottom: 20px; }
    .select-wrap svg { position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
                       pointer-events: none; color: var(--muted); }
    select {
      appearance: none; -webkit-appearance: none;
      width: 100%; font: inherit; font-size: 16px; color: var(--ink);
      padding: 14px 44px 14px 16px;
      background: var(--card);
      border: 1.5px solid var(--line); border-radius: 12px;
      transition: border-color .15s, box-shadow .15s;
    }
    select:hover:not(:disabled) { border-color: var(--muted); }
    select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    select:disabled { opacity: .6; }
    #send {
      width: 100%; font: inherit; font-size: 16px; font-weight: 600;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 15px; border: 0; border-radius: 12px;
      background: var(--accent); color: var(--accent-ink);
      cursor: pointer;
      transition: transform .1s, filter .15s, opacity .15s;
    }
    #send:hover:not(:disabled) { filter: brightness(1.08); }
    #send:active:not(:disabled) { transform: scale(.985); }
    button:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--accent-soft); }
    #send:disabled { opacity: .45; cursor: not-allowed; }

    .status {
      display: none; margin-top: 20px;
      padding: 14px 16px; border-radius: 12px;
      font-size: 14.5px; line-height: 1.45;
      gap: 12px; align-items: flex-start;
      animation: rise .25s ease-out;
    }
    .status.show { display: flex; }
    .status .icon { flex: none; width: 22px; height: 22px; display: grid; place-items: center; margin-top: -1px; }
    .status strong { display: block; font-weight: 600; margin-bottom: 2px; }
    .status.sending { background: var(--accent-soft); color: var(--accent); }
    .status.sent    { background: var(--ok-soft); color: var(--ok); }
    .status.failed  { background: var(--err-soft); color: var(--err); }
    .status .msg { color: var(--ink); opacity: .85; }
    .spinner { width: 18px; height: 18px; border: 2.5px solid currentColor; border-right-color: transparent;
               border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    .foot { text-align: center; color: var(--muted); font-size: 13px; margin: 18px 0 0; line-height: 1.5; }
    @media (max-width: 420px) {
      .banner { padding: 26px 22px 0; }
      .body { padding: 24px 22px 26px; }
      h1 { font-size: 25px; }
    }
    @media (max-width: 600px) { body { padding-top: 74px; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark mode">
    <svg class="sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    <svg class="moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
  <main class="card">
    <div class="banner">
      <div class="emblem" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/>
        </svg>
      </div>
      <div>
        <h1>Get your report card</h1>
        <p class="sub">Choose your name, and we'll email your report card to the address on file.</p>
      </div>
    </div>

    <div class="body">
      <label for="student">Student name</label>
      <div class="select-wrap">
        <select id="student" disabled><option>Loading names…</option></select>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </div>

      <button id="send" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>
        <span>Send Report</span>
      </button>

      <div id="status" class="status" role="status" aria-live="polite"></div>

      <p class="foot">Each report card can be sent once per day.</p>
    </div>
  </main>

  <script>
    // Light/dark toggle: follows the device until the visitor picks one, then remembers it.
    const themeBtn = document.getElementById("theme-toggle");
    const darkQuery = window.matchMedia("(prefers-color-scheme: dark)");
    function isDark() {
      const t = document.documentElement.dataset.theme;
      return t ? t === "dark" : darkQuery.matches;
    }
    function syncThemeButton() {
      const dark = isDark();
      document.documentElement.classList.toggle("dark-active", dark);
      themeBtn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
      themeBtn.title = dark ? "Light mode" : "Dark mode";
    }
    themeBtn.addEventListener("click", () => {
      const next = isDark() ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem("theme", next); } catch (e) {}
      syncThemeButton();
    });
    darkQuery.addEventListener("change", syncThemeButton);
    syncThemeButton();

    const select = document.getElementById("student");
    const button = document.getElementById("send");
    const statusEl = document.getElementById("status");

    const ICONS = {
      sending: '<span class="spinner"></span>',
      sent: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/></svg>',
      failed: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 7v6M12 17h.01"/></svg>'
    };
    const TITLES = { sending: "Sending…", sent: "Sent!", failed: "Couldn't send" };

    function setStatus(state, message) {
      statusEl.className = "status show " + state;
      statusEl.innerHTML = '<span class="icon">' + ICONS[state] + '</span>' +
                           '<div><strong></strong><span class="msg"></span></div>';
      statusEl.querySelector("strong").textContent = TITLES[state];
      statusEl.querySelector(".msg").textContent = message;
    }

    // Called without cookies so it works no matter how many Google accounts are signed in.
    const API_URL = "https://script.google.com/macros/s/AKfycbxhX4YBI3ZpIYV9ZuF3vgEAIgjlxCxyyvakwfTb0PD_U9lNTVuVjZrupMU-twc-xKAB/exec";

    async function api(options) {
      const res = await fetch(API_URL + (options.query || ""), {
        method: options.body ? "POST" : "GET",
        credentials: "omit",
        redirect: "follow",
        headers: options.body ? { "Content-Type": "text/plain;charset=utf-8" } : undefined,
        body: options.body ? JSON.stringify(options.body) : undefined
      });
      let data;
      try { data = await res.json(); }
      catch (e) { throw new Error("The server sent an unexpected response. Please try again."); }
      if (!data.ok) throw new Error(data.error || "Something went wrong.");
      return data;
    }

    api({ query: "?action=students" })
      .then(data => {
        select.innerHTML = '<option value="">Select your name</option>';
        data.names.forEach(n => select.add(new Option(n, n)));
        select.disabled = false;
      })
      .catch(err => setStatus("failed", "We couldn't load the student list. " + err.message));

    select.addEventListener("change", () => {
      button.disabled = !select.value;
      statusEl.className = "status";
    });

    button.addEventListener("click", () => {
      const name = select.value;
      if (!name) return;
      button.disabled = select.disabled = true;
      setStatus("sending", "Preparing the report card for " + name + ". This can take up to a minute.");

      api({ body: { name } })
        .then(res => {
          setStatus("sent", "The report card for " + name + " was emailed to " + res.recipient + ".");
          select.disabled = false;
        })
        .catch(err => {
          setStatus("failed", err.message);
          button.disabled = select.disabled = false;
        });
    });
  </script>
</body>
</html>
